name: GoldEssentials
main: br.goldsuite.essentials.GoldEssentials
version: "0.4.3"
api: ["1.0.0"]
depend: [GoldCore]
softdepend: [GoldAuth]
author: gustavoz65
description: Homes, warps, spawn, tpa, back, fly e tpall
commands:
 sethome: {description: "Salva uma home", usage: "/sethome [nome]"}
 home: {description: "Vai para uma home", usage: "/home [nome]", aliases: [casa]}
 delhome: {description: "Apaga uma home", usage: "/delhome <nome>"}
 warp: {description: "Lista ou usa warps", usage: "/warp [nome]", aliases: [warps]}
 setwarp: {description: "Cria warp (no console: com coordenadas)", usage: "/setwarp <nome> [<mundo> <x> <y> <z> [yaw]]", permission: goldessentials.admin}
 delwarp: {description: "Apaga warp", usage: "/delwarp <nome>", permission: goldessentials.admin}
 spawn: {description: "Vai ao spawn", usage: "/spawn", aliases: [lobby]}
 setspawn: {description: "Define o spawn", usage: "/setspawn", permission: goldessentials.admin}
 tpa: {description: "Pede para ir ate um jogador", usage: "/tpa <jogador>"}
 tpahere: {description: "Pede para um jogador vir ate voce", usage: "/tpahere <jogador>"}
 tpaccept: {description: "Aceita pedido de teleporte", usage: "/tpaccept", aliases: [tpaceitar]}
 tpdeny: {description: "Recusa pedido de teleporte", usage: "/tpdeny", aliases: [tprecusar]}
 back: {description: "Volta ao ultimo local", usage: "/back", aliases: [voltar], permission: goldessentials.back}
 fly: {description: "Liga ou desliga o voo", usage: "/fly [jogador]", aliases: [voar], permission: goldessentials.fly}
 config: {description: "Preferencias (tell, tpa e recebimento de coins)", usage: "/config", aliases: [preferencias]}
 luz: {description: "Liga ou desliga a lanterna (visao noturna)", usage: "/luz", permission: goldessentials.luz, aliases: [lanterna]}
 setloja: {description: "Marca a sua loja aqui", usage: "/setloja [remover]", permission: goldessentials.setloja}
 loja: {description: "Abre a loja do servidor; /loja <jogador> vai ate a loja dele", usage: "/loja [jogador]"}
 mundovip: {description: "Vai ao mundo VIP", usage: "/mundovip | /mundovip definir|remover"}
 tpall: {description: "Traz todos ate voce", usage: "/tpall", permission: goldessentials.admin}
permissions:
 goldessentials.admin: {default: op, description: "Warps, spawn e tpall"}
 goldessentials.back: {default: true, description: "Usa /back"}
 goldessentials.fly: {default: op, description: "Usa /fly (dar ao grupo vip pelo GoldPerms)"}
 goldessentials.fly.outros: {default: op, description: "Liga o voo de outro jogador"}
 goldessentials.instantaneo: {default: op, description: "Teleporta sem contagem"}
 goldessentials.warp.todas: {default: true, description: "Usa todas as warps"}
 goldessentials.homes.vip: {default: false, description: "5 homes em vez de 2"}
 goldessentials.luz: {default: op, description: "Usa /luz (dar ao VIP pelo GoldPerms)"}
 goldessentials.setloja: {default: op, description: "Marca a propria loja com /setloja (dar ao VIP)"}
 goldessentials.mundovip: {default: op, description: "Entra no mundo VIP (dar ao VIP)"}
