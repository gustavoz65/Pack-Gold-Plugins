allprojects {
    group = 'br.goldsuite'
    version = '0.4.3'
}

// O core fica no repositorio Nukkit-Gold-Edition; baixe com scripts/obter-nukkit.sh (ou .ps1)
// ou informe outro caminho com -PnukkitJar=...
def nukkitJar = rootProject.file(findProperty('nukkitJar') ?: 'lib/nukkit-gold.jar')

// Modulo -> classe do teste de regressao (programas Java comuns, sem framework de testes).
def regressoes = [
    'gold-core'   : 'br.goldsuite.core.CoreTest',
    'gold-auth'   : 'br.goldsuite.auth.AuthTest',
    'gold-perms'  : 'br.goldsuite.perms.PermissionTest',
    'gold-economy': 'br.goldsuite.economy.EconomyTest',
    'gold-npc'    : 'br.goldsuite.npc.NpcTest',
    'gold-hg'     : 'br.goldsuite.hg.HgTest',
    'gold-essentials': 'br.goldsuite.essentials.EssentialsTest',
    'gold-chat'   : 'br.goldsuite.chat.ChatTest',
    'gold-protect': 'br.goldsuite.protect.ProtectTest',
    'gold-staff'  : 'br.goldsuite.staff.StaffTest',
    'gold-kits'   : 'br.goldsuite.kits.KitsTest',
    'gold-vip'    : 'br.goldsuite.vip.VipTest',
    'gold-shop'   : 'br.goldsuite.shop.ShopTest',
    'gold-vault'  : 'br.goldsuite.vault.VaultTest',
    'gold-tags'   : 'br.goldsuite.tags.TagsTest',
    'gold-hud'    : 'br.goldsuite.hud.HudTest',
    'gold-pvp'    : 'br.goldsuite.pvp.PvpTest',
    'gold-crates' : 'br.goldsuite.crates.CratesTest',
    'gold-market' : 'br.goldsuite.market.MarketTest',
    'gold-factions': 'br.goldsuite.factions.FactionsTest',
    'gold-enchant': 'br.goldsuite.enchant.EnchantTest',
    'gold-breaker': 'br.goldsuite.breaker.BreakerTest',
    'gold-world'  : 'br.goldsuite.world.WorldTest',
    'gold-build'  : 'br.goldsuite.build.BuildTest',
    'gold-cosmetics': 'br.goldsuite.cosmetics.CosmeticsTest',
    'gold-device' : 'br.goldsuite.device.DeviceTest',
    'gold-keys'   : 'br.goldsuite.keys.KeysTest',
    'gold-skywars': 'br.goldsuite.skywars.SkyWarsTest',
    'gold-bedwars': 'br.goldsuite.bedwars.BedWarsTest',
    'gold-comandos': 'br.goldsuite.comandos.ComandosTest',
    'gold-party': 'br.goldsuite.party.PartyTest',
    'gold-skills': 'br.goldsuite.skills.SkillsTest',
    'gold-rankup': 'br.goldsuite.rankup.RankupTest',
    'gold-plots': 'br.goldsuite.plots.PlotsTest',
]

subprojects {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
    }
    dependencies {
        compileOnly files(nukkitJar)
        testImplementation files(nukkitJar)
    }
    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    if (name != 'gold-api') {
        if (name != 'gold-core') {
            // A API vai embutida no GoldCore; os demais modulos so compilam contra ela.
            dependencies {
                compileOnly project(':gold-api')
                testImplementation project(':gold-api')
            }
        }
        tasks.named('test') { enabled = false }
        def principal = regressoes[name]
        if (principal) {
            tasks.register('regression', JavaExec) {
                dependsOn testClasses
                classpath = sourceSets.test.runtimeClasspath
                mainClass = principal
                jvmArgs '-ea'
            }
            check.dependsOn regression
        }
    }
}

project(':gold-core') {
    dependencies {
        implementation project(':gold-api')
        implementation files(rootProject.file('lib/sqlite-jdbc-3.54.1.0.jar'))
    }
    jar {
        dependsOn configurations.runtimeClasspath
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF'
    }
}

// Copia os plugins prontos para dist/ com o nome usado no servidor (GoldCore-0.1.0.jar...).
tasks.register('dist') {
    def nomes = ['gold-core': 'GoldCore', 'gold-auth': 'GoldAuth', 'gold-perms': 'GoldPerms', 'gold-economy': 'GoldEconomy', 'gold-npc': 'GoldNPC', 'gold-hg': 'GoldHG', 'gold-essentials': 'GoldEssentials', 'gold-chat': 'GoldChat', 'gold-protect': 'GoldProtect', 'gold-staff': 'GoldStaff', 'gold-kits': 'GoldKits', 'gold-vip': 'GoldVip', 'gold-shop': 'GoldShop', 'gold-vault': 'GoldVault', 'gold-hud': 'GoldHud', 'gold-pvp': 'GoldPvP', 'gold-crates': 'GoldCrates', 'gold-market': 'GoldMarket', 'gold-factions': 'GoldFactions', 'gold-enchant': 'GoldEnchant', 'gold-breaker': 'GoldBreaker', 'gold-world': 'GoldWorld', 'gold-build': 'GoldBuild', 'gold-cosmetics': 'GoldCosmetics', 'gold-device': 'GoldDevice', 'gold-keys': 'GoldKeys', 'gold-skywars': 'GoldSkyWars', 'gold-bedwars': 'GoldBedWars', 'gold-comandos': 'GoldComandos', 'gold-party': 'GoldParty', 'gold-skills': 'GoldSkills', 'gold-tags': 'GoldTags', 'gold-rankup': 'GoldRankup', 'gold-plots': 'GoldPlots']
    dependsOn nomes.keySet().collect { ":$it:jar" }
    doLast {
        def destino = rootProject.file('dist')
        destino.mkdirs()
        nomes.each { modulo, nome ->
            copy {
                from project(":$modulo").tasks.jar.archiveFile
                into destino
                rename { "$nome-${version}.jar" }
            }
        }
    }
}

// Mensagens: toda chave usada em M.t("...") precisa existir no mensagens.yml do modulo e nenhum texto colorido
// (§ ou \u00a7) pode ficar fixo no codigo. Assim todas as mensagens continuam editaveis em plugins/<Plugin>/mensagens.yml.
tasks.register('mensagens') {
    def modulos = subprojects.findAll { it.name != 'gold-api' && it.file('src/main/java').isDirectory() }
    inputs.files(modulos.collect { it.fileTree('src/main') })
    doLast {
        def erros = []
        def literal = ~/"((?:\\.|[^"\\])*)"/
        modulos.each { m ->
            def yml = m.fileTree('src/main/resources') { include '**/mensagens.yml' }.files
            def chaves = [] as Set
            yml.each { f -> f.eachLine('UTF-8') { l -> if (!l.startsWith('#') && l.contains(': ')) { chaves << l.substring(0, l.indexOf(': ')).trim() } } }
            m.fileTree('src/main/java') { include '**/*.java' }.each { f ->
                f.readLines('UTF-8').eachWithIndex { linha, i ->
                    (linha =~ /M\.t\("([a-z0-9_]+)"/).each { mm -> if (!chaves.contains(mm[1])) { erros << "${m.name}/${f.name}:${i + 1}: chave sem texto no mensagens.yml: ${mm[1]}" } }
                    if (linha.contains('getLogger()') || linha.contains('Settings.') || linha.trim().startsWith('//') || linha.trim().startsWith('*')) { return }
                    (linha =~ literal).each { mm ->
                        def t = mm[1].replace('\\u00a7', '\u00a7')
                        if (t.contains('\u00a7') && (t.replaceAll(/\u00a7./, '') =~ /[A-Za-z]{3}/).find()) { erros << "${m.name}/${f.name}:${i + 1}: texto fixo no codigo: \"${mm[1]}\"" }
                    }
                }
            }
        }
        if (!erros.isEmpty()) { throw new GradleException("Mensagens fora do mensagens.yml:\n" + erros.take(40).join('\n')) }
    }
}
tasks.matching { it.name == 'check' }.configureEach { dependsOn 'mensagens' }
subprojects { tasks.matching { it.name == 'check' }.configureEach { dependsOn rootProject.tasks.named('mensagens') } }
