name: GoldHG
main: br.goldsuite.hg.GoldHG
version: "0.4.0"
api: ["1.0.0"]
depend: [GoldCore]
softdepend: [GoldAuth, GoldEconomy]
author: gustavoz65
description: Hunger Games com kits, feast, bussola e sopa pensada para celular
commands:
 hg:
  description: Hunger Games
  usage: "/hg entrar [arena] | sair | lista"
 hgkit:
  description: Escolhe o kit do HG
  usage: "/hgkit [nome]"
 hgkits:
  description: Abre o menu de kits do HG
  usage: "/hgkits"
 sopa:
  description: Liga ou desliga tomar sopa ao selecionar o slot
  usage: "/sopa"
permissions:
 goldhg.admin:
  default: op
  description: Cria arenas e controla partidas
