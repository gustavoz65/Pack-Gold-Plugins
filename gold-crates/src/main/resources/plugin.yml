name: GoldCrates
main: br.goldsuite.crates.GoldCrates
version: "0.4.3"
api: ["1.0.0"]
depend: [GoldCore]
author: gustavoz65
description: Caixas com chave assinada e caixas misteriosas (item que abre sozinho) com raridades, anuncio e premios de comando
commands:
 caixa: {description: "Gerencia caixas e entrega chaves", usage: "/caixa", aliases: [crate], permission: goldcrates.admin}
 caixas: {description: "Compra caixas misteriosas", usage: "/caixas", aliases: [comprarcaixa]}
permissions:
 goldcrates.admin: {default: op, description: "Cria caixas e da chaves"}
